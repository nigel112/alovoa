# Builds an installable Android APK on GitHub's runners.
#
# Drop this into the Expo app repo as .github/workflows/build-android.yml, push,
# then: Actions -> "Build Android APK" -> Run workflow -> download the artifact.
#
# No Expo account, no local JDK and no Android SDK needed: the ubuntu-latest
# image ships Java 17 and the Android SDK. Dependencies come from yarn.lock,
# the same way upstream's own ci.yml does it.
#
# Two APKs are produced:
#   * debug   - signed with the standard debug key, installs on any phone
#   * release - unsigned, for the Play Store / F-Droid to sign
# The workflow prints a signing report so you can confirm which key was used.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Gradle task
        required: true
        default: assembleDebug
        type: choice
        options: [assembleDebug, assembleRelease, both]
  pull_request:
  push:
    branches: [master, main, 'rebrand/**']
    paths-ignore:
      - '**.md'
      - 'fastlane/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (Expo 54 needs Node 20+)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Dependency check (expo-doctor)
        continue-on-error: true
        run: yarn doctor

      # generates android/, pins a patchable expo-location, applies the
      # node_modules patches and drops the signing config (scripts/f-droid.sh)
      - name: Generate the native Android project
        run: yarn f-droid
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Gradle memory settings (CI safe)
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=false
          org.gradle.daemon=false
          org.gradle.caching=false
          EOF

      - name: Which key does each variant use?
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew signingReport --no-daemon

      - name: Build debug APK (installable)
        if: ${{ inputs.build_type != 'assembleRelease' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        if: ${{ inputs.build_type != 'assembleDebug' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: baelink-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
